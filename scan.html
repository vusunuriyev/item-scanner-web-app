<!DOCTYPE html>
<!-- openlot-v7-multi -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1814" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Point at a window. Count the glass panes. Add them to an invoice."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Open Lot" />
    <title>Open Lot — Window glass count</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=7" />
  </head>
  <body>
    <a class="skip" href="#home">Skip to content</a>

    <section id="home" class="screen screen-home">
      <header class="mast">
        <p class="mark">Open Lot</p>
        <button class="text-btn" type="button" id="home-cart" aria-label="Open invoice list">
          Cart
          <span class="count" id="home-cart-count" hidden>0</span>
        </button>
      </header>
      <div class="hero">
        <p class="kicker">Window glass count</p>
        <h1>Point at the windows.<br />I’ll count every glass.</h1>
        <p class="lede">
          One window or several, side by side or stacked:
          <em>3 windows with three glass</em>
        </p>
      </div>
      <div class="actions">
        <button class="shutter-cta" type="button" id="start-camera">
          <span class="shutter-ring" aria-hidden="true"></span>
          <span class="shutter-core" aria-hidden="true"></span>
          <span class="shutter-label">Open the camera</span>
        </button>
        <label class="ghost-cta" for="photo-input">Use a photo from the library</label>
        <input id="photo-input" type="file" accept="image/*" hidden />
      </div>
    </section>

    <section id="camera" class="screen screen-camera hidden" aria-label="Window scanner">
      <div class="stage">
        <video id="live" playsinline muted autoplay webkit-playsinline></video>
        <canvas id="overlay" aria-hidden="true"></canvas>
        <img id="still" alt="" />

        <header class="field-bar">
          <button class="pill-btn" type="button" id="close-camera">Close</button>
          <button class="cart-btn" type="button" id="cart-open" aria-label="Open cart">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path
                fill="currentColor"
                d="M7 4h-2l-1 2v2h2l3.6 7.59-1.35 2.41A1 1 0 0 0 9 19h10v-2H9.42l.93-1.63L17.55 9H8.21L7 4Zm3 16a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"
              />
            </svg>
            <span class="cart-badge" id="cart-badge" hidden>0</span>
          </button>
        </header>

        <div id="cam-error" class="cam-error hidden" role="alert">
          <p id="cam-error-text"></p>
          <button class="invoice-btn" type="button" id="cam-retry">Turn camera on</button>
        </div>

        <footer class="field-dock">
          <p class="readout" id="readout">Aim at a window</p>
          <button class="invoice-btn" type="button" id="add-invoice">Create invoice</button>
        </footer>
      </div>
    </section>

    <section id="invoice" class="screen screen-lots hidden">
      <header class="mast">
        <button class="text-btn" type="button" id="invoice-back">Back</button>
        <p class="mark">Invoice</p>
        <span class="mast-spacer"></span>
      </header>
      <p class="lots-lead">Each line is one scanned window.</p>
      <ul class="lot-list" id="invoice-list"></ul>
      <button class="quiet" type="button" id="invoice-clear">Clear list</button>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./app.js?v=7"></script>
  </body>
</html>
